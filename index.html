<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Perception Survey</title>
  <meta name="description" content="Linguistic audio perception survey. Listen to each audio clip and rate it on five perceptual dimensions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Devanagari:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container" role="main">

    <!-- Header — no version badge shown to participant -->
    <header class="site-header">
      <h1 class="site-title">Audio Perception Survey</h1>
      <p class="site-subtitle">
        Listen carefully and respond to each question.<br>
        <span class="sub-hi">कृपया ध्यान से सुनें और प्रत्येक प्रश्न का उत्तर दें।</span><br>
        <span class="sub-hirom">Kripaya dhyan se sunein aur har prashn ka jawab dein.</span>
      </p>
    </header>

    <!-- Progress -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label">1 / 6</span>
    </div>

    <!-- Audio Card (dynamically rendered: Audio clips then Demographics) -->
    <div class="audio-card" id="audio-card">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading survey...<br><span style="font-size:14px;color:var(--text-secondary);">सर्वेक्षण लोड हो रहा है...</span></p>
      </div>
    </div>

    <!-- Final / Thank You Screen -->
    <div class="final-screen" id="final-screen" role="region" aria-label="Completion screen">
      <h2 class="final-title" id="final-title">Thank you.</h2>
      <p class="final-subtitle" id="final-sub">Your responses have been recorded.</p>
      <button class="download-btn" id="download-btn" style="display:none" aria-label="Download responses as CSV">
        ⬇ Download Responses (CSV)
      </button>
    </div>

  </main>

  <!-- Toast warning -->
  <div class="warning-toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="survey.js"></script>
  <script>
    // ── Version Assignment Mode ──────────────────────────────────────────────────
    // null: auto-balance by asking Google Sheets which version is least populated
    // 1, 2, or 3: manual override to force a specific version
    var FORCE_VERSION = null;

    // Cyclic audio assignment per version:
    //   v1: 11, 22, 33, 41, 52, 63
    //   v2: 12, 23, 31, 42, 53, 61
    //   v3: 13, 21, 32, 43, 51, 62
    var VERSIONS = [
      { version: 1, audios: ['11', '22', '33', '41', '52', '63'] },
      { version: 2, audios: ['12', '23', '31', '42', '53', '61'] },
      { version: 3, audios: ['13', '21', '32', '43', '51', '62'] }
    ];

    // Fisher-Yates shuffle
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function getRandomVersion() {
      return VERSIONS[Math.floor(Math.random() * VERSIONS.length)];
    }

    function getVersionByNumber(num) {
      for (var i = 0; i < VERSIONS.length; i++) {
        if (VERSIONS[i].version === num) return VERSIONS[i];
      }
      return getRandomVersion();
    }

    var STORAGE_KEY = 'survey_assignment';
    var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzBBd_JTtiQg8tRpocrWNWWoKgUk8vV_0itOixiJO8VvHOMZf--6V8zORVDwdPlQnrxtQ/exec';

    function startWithVersion(pick) {
      var assigned = { version: pick.version, audios: shuffle(pick.audios) };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(assigned));
      } catch (e) {}
      initSurvey(assigned);
    }

    // 1. Returning visitor check: restore existing assignment immediately
    var assigned = null;
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        assigned = JSON.parse(saved);
      }
    } catch (e) {}

    if (assigned) {
      initSurvey(assigned);
    } else if (FORCE_VERSION) {
      // 2. Manual version override
      startWithVersion(getVersionByNumber(FORCE_VERSION));
    } else {
      // 3. New visitor: Auto-balance using least populated version from Google Sheets
      var resolved = false;
      var timeoutTimer = setTimeout(function() {
        if (!resolved) {
          resolved = true;
          startWithVersion(getRandomVersion());
        }
      }, 2500);

      fetch(SHEETS_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!resolved) {
            resolved = true;
            clearTimeout(timeoutTimer);
            if (data && data.least) {
              startWithVersion(getVersionByNumber(data.least));
            } else {
              startWithVersion(getRandomVersion());
            }
          }
        })
        .catch(function() {
          if (!resolved) {
            resolved = true;
            clearTimeout(timeoutTimer);
            startWithVersion(getRandomVersion());
          }
        });
    }

    initSurvey(assigned);
  </script>

</body>
</html>
